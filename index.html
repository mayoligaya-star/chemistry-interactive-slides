<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chemistry 9–10 Slides | The Earth School El Nido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚗️</text></svg>">
<style>
:root{
  --paper:#F6F7FA; --card:#FFFFFF; --ink:#1C1A2B; --muted:#5B586C; --line:#DADCE5;
  --purple:#5B3FA8; --teal:#0E8388; --ok:#1F8A4C; --bad:#C0392B;
  --u1:#5B3FA8; --u2:#0E8388; --u3:#B26B00; --u4:#2F6FB3; --u5:#A23B72; --u6:#3D7A36;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15141D; --card:#1E1C29; --ink:#ECEAF4; --muted:#A8A5B8; --line:#34313F; --purple:#A48CF0; --teal:#4CC3C6; --ok:#4FC37E; --bad:#F07467;
  --u1:#A48CF0; --u2:#4CC3C6; --u3:#E8A63C; --u4:#74A9E8; --u5:#E07BB0; --u6:#86C77D;}}
:root[data-theme="dark"]{
  --paper:#15141D; --card:#1E1C29; --ink:#ECEAF4; --muted:#A8A5B8; --line:#34313F; --purple:#A48CF0; --teal:#4CC3C6; --ok:#4FC37E; --bad:#F07467;
  --u1:#A48CF0; --u2:#4CC3C6; --u3:#E8A63C; --u4:#74A9E8; --u5:#E07BB0; --u6:#86C77D;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:clamp(1rem,1.45vw,1.3rem);line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--sans);line-height:1.15;letter-spacing:-.01em;margin:0}
h4{font-size:1em;margin:.2em 0 .3em}
sub,sup{font-size:.72em;line-height:0}
p{margin:.45em 0}
ul,ol{margin:.4em 0;padding-left:1.3em}li{margin:.25em 0}
button{font:inherit;color:inherit}

.app{display:flex;flex-direction:column;height:100%}
.stage{position:relative;flex:1;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;padding:clamp(1rem,3vw,2.5rem) clamp(1rem,4vw,3.5rem);display:none}
.slide.on{display:block;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.in{max-width:1120px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:.6rem}

/* element tile */
.tile{--s:4.2rem;width:var(--s);height:var(--s);flex:none;border:2px solid var(--uc);border-radius:10px;background:color-mix(in srgb,var(--uc) 12%,var(--card));display:grid;place-items:center;position:relative;font-family:var(--sans);font-weight:800;font-size:calc(var(--s)*.4);color:var(--uc)}
.tile small{position:absolute;top:.25rem;left:.4rem;font-size:calc(var(--s)*.17);font-weight:700;color:var(--ink)}
.head{display:flex;align-items:center;gap:1rem;margin-bottom:.4rem}
.head .k{font-family:var(--sans);font-size:.78em;color:var(--muted);font-weight:600}
.head h2{font-size:clamp(1.5rem,3vw,2.4rem)}

/* title + unit slides */
.cover .in{align-items:flex-start}
.cover h1{font-size:clamp(2.4rem,7vw,5.2rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.cover .lede{font-size:1.15em;max-width:38ch;color:var(--muted)}
.grid20{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.4rem;width:100%;margin-top:1rem}
.grid20 button{all:unset;cursor:pointer}
.grid20 .tile{--s:100%;aspect-ratio:1;width:100%;height:auto;font-size:clamp(.9rem,2.2vw,1.6rem)}
.grid20 .tile small{font-size:clamp(.55rem,1vw,.8rem)}
.grid20 button:hover .tile,.grid20 button:focus-visible .tile{background:color-mix(in srgb,var(--uc) 28%,var(--card))}
.unit .in{align-items:flex-start}
.unit .num{font-family:var(--sans);font-weight:800;font-size:clamp(5rem,18vw,13rem);line-height:.85;color:var(--uc);letter-spacing:-.05em}
.unit h2{font-size:clamp(1.8rem,4.5vw,3.4rem);max-width:18ch}
.unit .chips{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.unit .chip{display:flex;align-items:center;gap:.6rem;font-family:var(--sans);font-weight:600;font-size:.9em}
.unit .chip .tile{--s:2.6rem}

/* content */
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.def{border-left:4px solid var(--uc);background:color-mix(in srgb,var(--uc) 8%,var(--card));padding:.6em .9em;border-radius:0 8px 8px 0;margin:.5em 0}
.big{font-family:var(--sans);font-weight:600;font-size:1.25em;text-align:center;padding:.6em;border:1.5px dashed var(--uc);border-radius:10px;margin:.5em 0}
.big.sm{font-size:1em}.big small{font-weight:400;color:var(--muted)}
.note{color:var(--muted);font-style:italic}
table{border-collapse:collapse;width:100%;font-size:.92em;margin:.4em 0;background:var(--card);border-radius:8px;overflow:hidden}
th,td{border:1px solid var(--line);padding:.35em .6em;text-align:left;vertical-align:top}
th{font-family:var(--sans);font-weight:600;background:color-mix(in srgb,var(--uc) 10%,var(--card))}
.iso{display:inline-flex;align-items:center;font-family:var(--sans);font-weight:600}
.iso>span{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1;font-size:.62em;margin-right:.08em}
.iso>span sup,.iso>span sub{font-size:1em;line-height:1.05;vertical-align:baseline}
.bigsym{font-size:3.4em;text-align:center}
.rules{list-style:none;padding:0;font-family:var(--sans);font-weight:600}
.rules li{padding:.3em .6em;border-bottom:1px solid var(--line)}
.fig{display:flex;flex-direction:column;align-items:center}
.dia{width:100%;max-width:340px;height:auto}
.fig .two .dia{max-width:260px}
.key{display:flex;gap:1rem;font-family:var(--sans);font-size:.8em;color:var(--muted)}
.key i{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:.3em;vertical-align:-.05em}
.bohrs{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;font-family:var(--sans);font-size:.85em;text-align:center}
.bohrs svg{display:block;margin:0 auto}
.time{list-style:none;padding:0;border-left:3px solid var(--uc);margin-left:.5rem}
.time li{padding:.3em 0 .5em 1rem;position:relative}
.time li::before{content:"";position:absolute;left:-.5rem;top:.75em;width:.75rem;height:.75rem;border-radius:50%;background:var(--uc)}

/* pH widget */
.ph label{font-family:var(--sans);font-weight:600}
.ph input{width:100%;accent-color:var(--uc);margin:.6em 0}
.phbox{border-radius:12px;padding:1.2em;color:#111;font-family:var(--sans);display:flex;flex-direction:column;gap:.2em;transition:background .2s;min-height:7em;justify-content:center}
.phbox b{font-size:1.4em}

/* column widget */
.col2{display:grid;grid-template-columns:minmax(10rem,16rem) 1fr;gap:1.2rem;align-items:center}
.fcol{display:flex;flex-direction:column;gap:3px;border:2px solid var(--ink);border-radius:30px 30px 8px 8px;padding:.6rem;background:linear-gradient(to bottom,color-mix(in srgb,var(--u4) 18%,var(--card)),color-mix(in srgb,var(--u3) 25%,var(--card)))}
.fcol button{font-family:var(--sans);font-weight:600;font-size:.85em;padding:.35em;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer}
.fcol button[aria-pressed=true]{background:var(--uc);color:var(--card);border-color:var(--uc)}
.ftop,.fbot{font-family:var(--sans);font-size:.7em;color:var(--muted);text-align:center}
.fout{display:flex;flex-direction:column;gap:.3em;border:1.5px solid var(--line);border-radius:10px;padding:1em;background:var(--card);min-height:8em}
.fout b{font-family:var(--sans);font-size:1.2em}

/* worked example + problems */
.prob{font-size:1.12em;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.8em 1em}
.steps{display:flex;flex-direction:column;gap:.5rem}
.stage-b{display:none}
.stage-b.show{display:block;animation:in .25s ease-out}
.row{display:grid;grid-template-columns:8.5em 1fr;gap:.8em;padding:.35em 0;border-bottom:1px dashed var(--line)}
.row b{font-family:var(--sans);color:var(--uc)}
.ans{font-family:var(--sans);font-weight:700;font-size:1.1em;padding:.6em .9em;border-radius:8px;background:color-mix(in srgb,var(--ok) 14%,var(--card));border:1.5px solid var(--ok)}
.reveal{align-self:flex-start;font-family:var(--sans);font-weight:600;font-size:.9em;padding:.5em 1em;border-radius:8px;border:1.5px solid var(--uc);background:var(--card);color:var(--uc);cursor:pointer}
.reveal:hover{background:color-mix(in srgb,var(--uc) 12%,var(--card))}
.reveal[hidden]{display:none}

/* quiz */
.qwrap{display:grid;grid-template-columns:12rem 1fr;gap:1.5rem;align-items:start}
.qnav{display:flex;flex-direction:column;gap:.4rem;font-family:var(--sans)}
.qnav button{display:flex;align-items:center;gap:.6rem;padding:.45em .6em;border:1.5px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:.85em;font-weight:600;text-align:left}
.qnav button[aria-current=true]{border-color:var(--uc);background:color-mix(in srgb,var(--uc) 10%,var(--card))}
.qnav .dot{width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;font-size:.8em;border:1.5px solid var(--muted);flex:none}
.qnav .ok .dot{background:var(--ok);border-color:var(--ok);color:var(--card)}
.qnav .no .dot{background:var(--bad);border-color:var(--bad);color:var(--card)}
.score{font-family:var(--sans);font-size:.85em;color:var(--muted);margin-top:.4rem}
.q{display:none;flex-direction:column;gap:.7rem}.q.show{display:flex}
.q .qt{font-size:1.15em;font-weight:500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.opt{text-align:left;padding:.7em .9em;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;display:flex;gap:.7em;align-items:baseline;font-family:var(--serif)}
.opt:hover:not(:disabled){border-color:var(--uc)}
.opt .l{font-family:var(--sans);font-weight:700;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.fb{display:none;padding:.6em .9em;border-radius:8px;font-size:.95em}
.fb.show{display:block}
.fb.good{background:color-mix(in srgb,var(--ok) 12%,var(--card));border-left:4px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 10%,var(--card));border-left:4px solid var(--bad)}
.fb b{font-family:var(--sans)}
.qfoot{display:flex;gap:.6rem;flex-wrap:wrap}
.qfoot button{font-family:var(--sans);font-weight:600;font-size:.88em;padding:.5em 1em;border-radius:8px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.qfoot .go{background:var(--uc);border-color:var(--uc);color:var(--card)}
.qfoot button:disabled{opacity:.4;cursor:default}
.badge{font-family:var(--sans);font-weight:700;font-size:.75em;padding:.2em .6em;border-radius:20px;background:color-mix(in srgb,var(--uc) 15%,var(--card));color:var(--uc);align-self:flex-start}

/* bottom bar */
.bar{display:flex;align-items:center;gap:.6rem;padding:.5rem 1rem;border-top:1px solid var(--line);background:var(--card);font-family:var(--sans);font-size:.85rem;position:relative}
.bar .prog{position:absolute;left:0;top:-1px;height:3px;background:var(--uc,var(--purple));transition:width .2s}
.bar .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.bar button{font-family:var(--sans);font-weight:600;font-size:.85rem;padding:.45rem .8rem;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;color:var(--ink)}
.bar button:hover{border-color:var(--uc,var(--purple))}
.bar .cnt{font-variant-numeric:tabular-nums;color:var(--muted);min-width:4.5em;text-align:center}
.menu{position:absolute;bottom:3.4rem;left:1rem;width:min(22rem,calc(100% - 2rem));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.5rem;display:none;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.menu.open{display:block}
.menu .mu{font-family:var(--sans);font-size:.75rem;font-weight:700;color:var(--muted);padding:.6rem .5rem .2rem}
.menu button{all:unset;display:flex;gap:.6rem;align-items:center;width:100%;padding:.35rem .5rem;border-radius:6px;cursor:pointer;font-family:var(--sans);font-size:.88rem}
.menu button:hover,.menu button:focus-visible{background:var(--paper)}
.menu .tile{--s:1.9rem;border-width:1.5px;border-radius:6px}

@media (max-width:760px){
  .two,.three,.qwrap,.col2{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .qnav{flex-direction:row;flex-wrap:wrap}
  .qnav button span.t{display:none}
  .grid20{grid-template-columns:repeat(5,minmax(0,1fr))}
  .row{grid-template-columns:1fr;gap:0}
  .bar .lbl{display:none}
  .bar{gap:.3rem;padding:.45rem .5rem;justify-content:space-between}
  .bar button{padding:.4rem .55rem;font-size:.8rem}
  .bar .cnt{min-width:3.6em;font-size:.78rem}
  .slide{padding-bottom:2rem}
}
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage" aria-live="polite"></main>
  <nav class="bar" aria-label="Slide controls">
    <div class="prog" id="prog"></div>
    <button id="mbtn" aria-expanded="false" aria-controls="menu">Chapters</button>
    <span class="lbl" id="lbl"></span>
    <button id="theme" aria-label="Switch light or dark mode">Dark</button>
    <button id="prev" aria-label="Previous slide">Back</button>
    <span class="cnt" id="cnt"></span>
    <button id="next" aria-label="Next slide">Next</button>
    <div class="menu" id="menu"></div>
  </nav>
</div>
<script>
const UNITS={1:'Atomic structure and the Periodic Table',2:'Ions, bonding and compounds',3:'Chemical reactions',4:'Periodic trends',5:'Electrochemistry',6:'Organic chemistry'};
const CH={
1:['At','Atom structure',1],2:['Is','Isotopes',1],3:['Mo','Relative mass and the mole',1],4:['Pt','Periodic Table development',1],5:['Ec','Electron configuration',1],
6:['Io','Formation of ions',2],7:['Fn','Formulae and naming',2],8:['Cb','Covalent bonding',2],
9:['Eq','Balancing equations',3],10:['pH','Acids, bases and pH',3],11:['Ac','Reactions of acids',3],12:['Sa','Preparation of salts',3],13:['En','Energy changes',3],
14:['Gr','Group 1 metals',4],15:['El','Electrolysis',5],
16:['Hc','Alkanes, alkenes and alkynes',6],17:['Cm','Combustion of alkanes',6],18:['Fd','Crude oil and fractional distillation',6],19:['Ck','Cracking',6],20:['Po','Macromolecules',6]};

const ATOM_SVG=`<svg viewBox="-110 -110 220 220" class="dia" role="img" aria-label="Atom with a nucleus of protons and neutrons and electrons in two shells">
<circle r="58" fill="none" stroke="var(--line)" stroke-width="2"/><circle r="95" fill="none" stroke="var(--line)" stroke-width="2"/>
<g><circle cx="-7" cy="-6" r="9" fill="var(--uc)"/><circle cx="8" cy="-5" r="9" fill="var(--muted)"/><circle cx="-6" cy="9" r="9" fill="var(--muted)"/><circle cx="9" cy="9" r="9" fill="var(--uc)"/></g>
<circle cx="0" cy="-58" r="6" fill="var(--teal)"/><circle cx="0" cy="58" r="6" fill="var(--teal)"/><circle cx="95" cy="0" r="6" fill="var(--teal)"/><circle cx="-67" cy="67" r="6" fill="var(--teal)"/>
